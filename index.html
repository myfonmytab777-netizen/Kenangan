<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kenangan Kelas — Memory Vault</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Pautan ke Fail CSS Berasingan -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen selection:bg-slate-700 selection:text-white">

  <!-- Notifikasi Pop-up -->
  <div id="notificationBanner" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden items-center gap-3 bg-slate-900 border border-slate-700 backdrop-blur-md px-5 py-3 rounded-xl shadow-2xl transition-all">
    <span id="notifText" class="text-sm text-slate-200 font-light">Mesej notifikasi</span>
  </div>

  <!-- Navigasi Atas -->
  <nav class="fixed top-0 w-full p-6 z-40 flex justify-end pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-4">
      <button id="navLoginBtn" onclick="switchView('login')" class="text-slate-400 hover:text-white flex items-center gap-1.5 text-xs uppercase tracking-widest bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-full cursor-pointer transition">
        Log Masuk Moderator
      </button>
      <button id="navLogoutBtn" onclick="handleLogout()" class="hidden text-slate-400 hover:text-white flex items-center gap-2 text-sm uppercase tracking-widest bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-full cursor-pointer transition">
        Keluar
      </button>
    </div>
  </nav>

  <!-- Kandungan Utama -->
  <main class="relative z-10 container mx-auto px-6 py-24 min-h-screen flex flex-col items-center">
    
    <!-- PAPARAN: GALERI UTAMA -->
    <section id="galleryView" class="w-full max-w-6xl flex flex-col items-center">
      <div class="text-center mb-20 relative">
        <h1 class="text-4xl md:text-6xl font-light tracking-widest uppercase mb-4">
          Kenangan <span class="font-semibold">Kelas</span>
        </h1>
        <p class="text-slate-400 tracking-[0.2em] uppercase text-sm md:text-base">
          Memori yang kekal abadi
        </p>
      </div>

      <div id="memoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 w-full">
        <!-- Dirender secara dinamik melalui app.js -->
      </div>
    </section>

    <!-- PAPARAN: LOG MASUK MODERATOR -->
    <section id="loginView" class="hidden w-full max-w-md flex-1 flex items-center justify-center -mt-10">
      <div class="w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 p-10 rounded-2xl shadow-2xl">
        <div class="flex flex-col items-center mb-8">
          <h2 class="text-2xl font-light tracking-wider">Log Masuk</h2>
          <p class="text-sm text-slate-400 tracking-wide mt-2 uppercase">Moderator Rasmi Sahaja</p>
        </div>

        <form onsubmit="handleLoginSubmit(event)" class="space-y-6">
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Kata Nama</label>
            <input type="text" id="loginUser" class="w-full bg-slate-950 border border-slate-800 focus:border-slate-500 rounded-lg px-4 py-3 text-slate-200 outline-none" required />
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Kata Laluan</label>
            <input type="password" id="loginPass" class="w-full bg-slate-950 border border-slate-800 focus:border-slate-500 rounded-lg px-4 py-3 text-slate-200 outline-none" required />
          </div>
          <button type="submit" class="w-full bg-slate-200 hover:bg-white text-slate-900 font-medium py-3 rounded-lg transition cursor-pointer mt-4">
            Log Masuk
          </button>
        </form>
        <div class="text-center mt-6">
          <button onclick="switchView('gallery')" class="text-xs text-slate-500 hover:text-slate-300 uppercase tracking-widest cursor-pointer">Kembali ke Galeri</button>
        </div>
      </div>
    </section>

    <!-- PAPARAN: DASHBOARD MODERATOR -->
    <section id="dashboardView" class="hidden w-full max-w-4xl">
      <div class="mb-12 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
        <div>
          <div class="text-emerald-400 text-xs font-semibold uppercase tracking-widest mb-1">Moderator Rasmi (GlacianDigital)</div>
          <h2 class="text-3xl font-light tracking-wider mb-2">Papan Pemuka</h2>
          <p class="text-slate-400 text-sm tracking-wide uppercase">Pengurusan Kenangan Kelas</p>
        </div>
        <button onclick="openAddModal()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg transition cursor-pointer text-sm border border-slate-700">
          Tambah Kenangan
        </button>
      </div>

      <div id="dashboardList" class="flex flex-col gap-4">
        <!-- Senarai di dashboard -->
      </div>
    </section>

  </main>

  <!-- MODAL LIGHTBOX GAMBAR PENUH -->
  <div id="lightboxModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl hidden">
    <button onclick="closeLightbox()" class="absolute top-6 right-6 z-50 p-3 text-slate-400 hover:text-white cursor-pointer">✕</button>
    <div class="relative z-10 w-full max-w-4xl flex flex-col md:flex-row bg-slate-900 border border-slate-800 rounded-lg overflow-hidden shadow-2xl">
      <div class="md:w-2/3 bg-black flex items-center justify-center">
        <img id="lightboxImg" src="" alt="Kenangan" class="w-full h-[50vh] md:h-[70vh] object-cover" />
      </div>
      <div class="md:w-1/3 p-8 flex flex-col justify-center bg-slate-900/50">
        <h2 id="lightboxTitle" class="text-3xl font-light mb-2">Nama</h2>
        <p id="lightboxDate" class="text-sm text-slate-400 tracking-widest uppercase mb-8">Tarikh</p>
        <div class="w-12 h-[1px] bg-slate-700 mb-8"></div>
        <p id="lightboxDesc" class="text-slate-300 leading-relaxed font-light text-sm md:text-base">Keterangan</p>
      </div>
    </div>
  </div>

  <!-- MODAL TAMBAH / SUNTING -->
  <div id="formModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <div class="relative z-10 w-full max-w-lg bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
      <button onclick="closeFormModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white cursor-pointer">✕</button>
      <h3 id="formModalTitle" class="text-2xl font-light mb-6">Tambah Kenangan</h3>
      
      <form onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="editMemoryId" />
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Nama</label>
          <input type="text" id="inputName" class="w-full bg-slate-950 border border-slate-800 focus:border-slate-500 rounded-lg px-4 py-2 text-slate-200 outline-none" required />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Tarikh</label>
          <input type="text" id="inputDate" class="w-full bg-slate-950 border border-slate-800 focus:border-slate-500 rounded-lg px-4 py-2 text-slate-200 outline-none" placeholder="Contoh: 12 Ogos 2026" required />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Pilih Gambar</label>
          <input type="file" id="inputFile" accept="image/*" onchange="previewImage(event)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer" />
          <div id="previewContainer" class="mt-2 hidden">
            <img id="imagePreviewTag" src="" alt="Pratonton" class="h-24 object-cover rounded border border-slate-800" />
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Keterangan</label>
          <textarea id="inputDesc" rows="3" class="w-full bg-slate-950 border border-slate-800 focus:border-slate-500 rounded-lg px-4 py-2 text-slate-200 outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-white text-slate-900 font-medium py-3 rounded-lg mt-6 hover:bg-slate-200 transition cursor-pointer">
          Simpan Kenangan
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL PENGESAHAN PADAM -->
  <div id="deleteModal" class="fixed inset-0 z-60 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md hidden">
    <div class="relative z-10 w-full max-w-sm bg-slate-900 border border-slate-700 p-6 rounded-xl shadow-2xl text-center">
      <input type="hidden" id="deleteTargetId" />
      <h3 class="text-xl font-medium mb-2">Padam Kenangan?</h3>
      <p class="text-sm text-slate-400 mb-6">Tindakan ini tidak boleh dikembalikan.</p>
      <div class="flex gap-3">
        <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">Batal</button>
        <button onclick="confirmExecuteDelete()" class="flex-1 py-2.5 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white transition cursor-pointer">Padam</button>
      </div>
    </div>
  </div>

  <!-- Pautan ke Fail Logik JavaScript Berasingan -->
  <script src="app.js"></script>
</body>
</html>
